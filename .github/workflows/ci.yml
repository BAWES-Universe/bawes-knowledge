name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    name: Open-source guardrail scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run guardrail scan
        run: bash scripts/guardrail-scan.sh
